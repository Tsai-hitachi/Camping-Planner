        <input 
          type="text" 
          value={val}
          onChange={(e) => setVal(e.target.value)}
          onBlur={() => { if (val !== initialValue) onSave(val); }}
          placeholder={placeholder}
          className={`border border-stone-200 bg-white/70 rounded-md px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 transition-shadow ${className}`}
        />

          setIsLoading(false);
        });
        return () => { unsubMenu(); unsubCheck(); };

                <p className="text-stone-500 mb-6 text-sm">點擊展開菜單，並依照分類填寫需要的食材。</p>
                <div className="space-y-4">
                  {MENU_DATA.map(meal => {
                    const isExpanded = expandedMeals.includes(meal.id);
                    return (
                      <div key={meal.id} className="bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden transition-all duration-200">
                        <button onClick={() => toggleMealAccordion(meal.id)} className="w-full px-6 py-4 flex items-center justify-between bg-stone-50 hover:bg-stone-100/50 transition-colors">
                          <span className="font-bold text-stone-800 text-left">{meal.title}</span>
                          {isExpanded ? <ChevronUp className="w-5 h-5 text-stone-400" /> : <ChevronDown className="w-5 h-5 text-stone-400" />}
                        </button>
                        
                        {isExpanded && (
                          <div className="p-6 bg-white border-t border-stone-100">
                            {meal.type === 'list' && (
                              <div className="grid md:grid-cols-2 gap-4">
                                {meal.items.map((dish, idx) => {
                                  const key = `${meal.id}_dish_${idx}`;
                                  return (
                                    <div key={idx} className="bg-stone-50 rounded-xl p-4 border border-stone-100">
                                      <span className="block text-sm font-medium text-emerald-800 mb-2">{dish}</span>
                                      <SyncInput initialValue={menuState[key]} onSave={(v) => updateMenuData(key, v)} placeholder="請填寫需要的食材..." className="w-full" />
                                    </div>
                                  );
                                })}
                              </div>
                            )}
                            {meal.type === 'fields' && (
                              <div className="grid md:grid-cols-3 gap-4">
                                {meal.fields.map((field, idx) => {
                                  const key = `${meal.id}_field_${idx}`;
                                  return (
                                    <div key={idx} className="flex flex-col gap-2">
                                      <span className="text-sm font-medium text-stone-500 pl-1">{field}</span>
                                      <SyncInput initialValue={menuState[key]} onSave={(v) => updateMenuData(key, v)} placeholder={`請輸入${field}...`} className="w-full" />
                                    </div>
                                  );
                                })}
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            );

          case 'checklist':
            return (
              <div className="p-4 md:p-8 animate-fade-in pb-24 md:pb-8">
                <h2 className="text-2xl font-bold text-stone-800 mb-2 flex items-center gap-2"><CheckSquare className="text-emerald-600" /> 裝備 Check List</h2>
                <p className="text-stone-500 mb-6 text-sm">點擊分類展開細項，打勾確認或寫下備註（如負責人、租借數量等）。</p>
                <div className="grid md:grid-cols-2 gap-4 items-start">
                  {CHECKLIST_CATEGORIES.map(category => {
                    const isExpanded = expandedChecklists.includes(category.id);
                    return (
                      <div key={category.id} className="bg-white rounded-2xl shadow-sm border border-stone-100 overflow-hidden">
                        <button onClick={() => toggleChecklistAccordion(category.id)} className="w-full px-5 py-4 flex items-center justify-between bg-stone-50 hover:bg-stone-100/50 transition-colors">
                          <h3 className="font-bold text-stone-800">{category.title}</h3>
                          {isExpanded ? <ChevronUp className="w-5 h-5 text-stone-400" /> : <ChevronDown className="w-5 h-5 text-stone-400" />}
                        </button>
                        
                        {isExpanded && (
                          <div className="p-2 border-t border-stone-100">
                            <div className="divide-y divide-stone-50">
                              {category.items.map(item => {
                                const isChecked = checklistState[`${item.id}_checked`] || false;
                                const remarkKey = `${item.id}_remark`;
                                return (
                                  <div key={item.id} className="flex flex-col sm:flex-row sm:items-center gap-3 px-4 py-3 hover:bg-stone-50/50 rounded-lg transition-colors">
                                    <label className="flex items-center gap-3 cursor-pointer flex-1 group">
                                      <div className="relative flex items-center justify-center">
                                        <input type="checkbox" checked={isChecked} onChange={(e) => updateChecklistData(`${item.id}_checked`, e.target.checked)} className="peer sr-only" />
                                        <div className="w-5 h-5 border-2 border-stone-300 rounded-md peer-checked:bg-emerald-500 peer-checked:border-emerald-500 transition-all flex items-center justify-center">
                                          <svg className={`w-3.5 h-3.5 text-white ${isChecked ? 'opacity-100 scale-100' : 'opacity-0 scale-50'} transition-all`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="3"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>
                                        </div>
                                      </div>
                                      <span className={`text-sm select-none transition-colors ${isChecked ? 'text-stone-400 line-through' : 'text-stone-700 font-medium group-hover:text-stone-900'}`}>{item.name}</span>
                                    </label>
                                    <div className="pl-8 sm:pl-0 w-full sm:w-48 shrink-0">
                                      <SyncInput initialValue={checklistState[remarkKey]} onSave={(v) => updateChecklistData(remarkKey, v)} placeholder="新增備註..." className="w-full bg-transparent border-stone-200/60 focus:bg-white" />
                                    </div>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          default: return null;
        }
      };

      const navItems = [
        { id: 'info', label: '營區資訊', icon: Info },
        { id: 'partners', label: '夥伴', icon: Users },
        { id: 'rental', label: '租借', icon: Tent },
        { id: 'menu', label: '菜單', icon: Utensils },
        { id: 'checklist', label: '清單', icon: CheckSquare }
      ];

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-stone-50/50">
          {/* Desktop Sidebar */}
          <aside className="hidden md:flex flex-col w-64 bg-white border-r border-stone-200 fixed h-full z-10">
            <div className="p-6 border-b border-stone-100">
              <h1 className="text-xl font-black text-emerald-900 tracking-tight flex items-center gap-2"><Tent className="text-emerald-600" /> 幻營旅團</h1>
              <p className="text-xs text-stone-400 mt-1 font-medium">Camping Planner</p>
            </div>
            <nav className="flex-1 p-4 space-y-1 overflow-y-auto no-scrollbar">
              {navItems.map(item => {
                const Icon = item.icon;
                const isActive = activeTab === item.id;
                return (
                  <button key={item.id} onClick={() => setActiveTab(item.id)} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all duration-200 ${isActive ? 'bg-emerald-50 text-emerald-700 shadow-sm' : 'text-stone-600 hover:bg-stone-50 hover:text-stone-900'}`}>
                    <Icon className={`w-5 h-5 ${isActive ? 'text-emerald-600' : 'text-stone-400'}`} /> {item.label}
                  </button>
                );
              })}
            </nav>
          </aside>

          {/* Mobile Bottom Nav */}
          <nav className="md:hidden fixed bottom-0 w-full bg-white border-t border-stone-200 flex justify-around p-2 pb-safe z-50 shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.1)]">
            {navItems.map(item => {
              const Icon = item.icon;
              const isActive = activeTab === item.id;
              return (
                <button key={item.id} onClick={() => setActiveTab(item.id)} className="flex flex-col items-center p-2 rounded-xl min-w-[4rem] transition-colors relative">
                  <Icon className={`w-6 h-6 mb-1 transition-colors ${isActive ? 'text-emerald-600' : 'text-stone-400'}`} />
                  <span className={`text-[10px] font-semibold ${isActive ? 'text-emerald-700' : 'text-stone-500'}`}>{item.label}</span>
                  {isActive && <div className="absolute top-0 w-8 h-1 bg-emerald-500 rounded-b-full shadow-sm" />}
                </button>
              );
            })}
          </nav>

          {/* Main Content Area */}
          <main className="flex-1 md:ml-64 relative min-h-screen">
            <div className="max-w-4xl mx-auto w-full">
              <header className="md:hidden bg-white/80 backdrop-blur-md sticky top-0 z-40 border-b border-stone-200/50 p-4 px-6 flex items-center justify-center shadow-sm">
                <h1 className="text-lg font-black text-emerald-900 tracking-tight flex items-center gap-2"><Tent className="text-emerald-600 w-5 h-5" /> 幻營旅團</h1>
              </header>
              {renderTabContent()}
            </div>
          </main>
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
